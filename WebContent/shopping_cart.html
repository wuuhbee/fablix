<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles/styles.css">
    <title>Shopping Cart</title>
</head>
<body>

<button type="button" onclick="window.location.href='movie_list.html'" class="nav-button">
    <i class="fa-solid fa-angles-left"></i> Back to Movies List
</button>

<h1>Shopping Cart</h1>

<table id="cart_table" class="table table-striped">
    <thead>
    <tr>
        <th>Movie Title</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Subtotal</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody id="cart_table_body"></tbody>
</table>

<h3 id="cart_total"></h3>

<button type="button" onclick="window.location.href='payment.html'" class="page-button">
    Proceed to Payment
</button>

<!-- Load jQuery and Bootstrap JS -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

<script src="shopping_cart.js"></script>
</body>

</html>
